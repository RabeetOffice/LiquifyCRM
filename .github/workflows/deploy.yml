name: Deploy

# main -> production, develop -> staging. Code goes live automatically;
# database migrations wait for "Backup and run database update" on the
# System screen (see docs/ and README "Deploy steps").

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: liquifycrm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath, exif, sodium
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (with dev, for tests)
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: liquifycrm_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan filament:assets
          vendor/bin/pest --ci

      - name: Record release version
        run: echo "${GITHUB_SHA}" > .release

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy with Deployer (new release folder + symlink switch)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP: ${{ secrets.DEPLOY_PHP }}
        run: |
          vendor/bin/dep deploy ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }} -vv \
            --option=identity_file=~/.ssh/deploy_key

      - name: Notify LiquifyCRM
        run: |
          curl --fail --silent --show-error -X POST \
            "${{ secrets.APP_URL }}/hooks/deploy/${{ secrets.DEPLOY_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d "{\"sha\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\",\"actor\":\"${GITHUB_ACTOR}\",\"run_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
