        :root {
            color-scheme: light;
            --ink: #1c1917;
            --muted: #78716c;
            --bg: #f5f4f1;
            --card: #ffffff;
            --border: rgb(28 25 23 / 0.08);
            --orange: #ff6b2c;
            --orange-hover: #f7631b;
            --shadow: 0 1px 2px rgb(28 25 23 / 0.04), 0 24px 56px -16px rgb(28 25 23 / 0.18);
        }

        .dark {
            color-scheme: dark;
            --ink: #fafaf9;
            --muted: #a8a29e;
            --bg: #0a0909;
            --card: #1b1818;
            --border: rgb(255 255 255 / 0.085);
            --orange: #ff8a4c;
            --orange-hover: #ff9a63;
            --shadow: 0 2px 8px rgb(0 0 0 / 0.4), 0 28px 64px -16px rgb(0 0 0 / 0.75);
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            background:
                radial-gradient(60rem 30rem at 50% -10%, rgb(255 107 44 / 0.12), transparent 70%),
                var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: min(26rem, 100%);
            padding: 2.25rem 2rem 2rem;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card);
            box-shadow: var(--shadow);
            text-align: center;
        }

        main > img {
            display: block;
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto;
        }

        h1 {
            margin: 1.25rem 0 0.5rem;
            font-size: 1.25rem;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 1.5rem;
            color: var(--muted);
            font-size: 0.9375rem;
            line-height: 1.55;
        }

        button {
            min-height: 2.5rem;
            padding: 0 1.25rem;
            border: 0;
            border-radius: 10px;
            background: var(--orange);
            color: #1c1917;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: var(--orange-hover);
        }

        button:focus-visible {
            outline: 2px solid var(--orange);
            outline-offset: 3px;
        }
    </style>
